<style>
/* Layout: 全画面の一人称ビュー。HUDは四隅、タイトル/ポーズ/結果は中央カード。 */
:root{
  --bg:#050607; --fg:#cfd4c8; --dim:#6d746a; --blood:#a3211a; --sick:#8fa383; --amber:#e0a93f;
  --f-disp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
/* 起動時ロゴシーケンス */
#openingSequence{position:absolute;inset:0;z-index:1000;display:grid;place-items:center;background:#000;opacity:1;transition:opacity .48s ease;pointer-events:auto;cursor:pointer;touch-action:manipulation}
#openingSequence .skip-hint{position:absolute;right:14px;bottom:12px;font:12px/1.4 system-ui,sans-serif;color:rgba(255,255,255,.45);letter-spacing:.08em;pointer-events:none}
#openingSequence.fade-out{opacity:0}
#openingSequence img{display:block;max-width:88vw;max-height:78vh;width:auto;height:auto;object-fit:contain;opacity:0;transform:scale(.985);transition:opacity .42s ease,transform .42s ease}
#openingSequence.visible img{opacity:1;transform:scale(1)}
#openingSequence img.opening-rating{max-width:min(82vw,460px);max-height:72vh;background:#fff}
#openingSequence img.opening-title{max-width:90vw;max-height:72vh}
.main-title-logo{display:block;width:100%;height:auto;max-height:34vh;object-fit:contain;margin:0 auto 18px}
@media(prefers-reduced-motion:reduce){#openingSequence,#openingSequence img{transition:none}}

#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 36%,rgba(0,0,0,.88) 100%);opacity:.75}
#hurt{background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(160,12,12,.7) 100%);opacity:0}
#grain{width:100%;height:100%;mix-blend-mode:overlay;opacity:.16;image-rendering:pixelated}
#flash{background:#fff;opacity:0}
#cut{background:#000;opacity:0}
#arch,#admin{position:absolute;inset:0;display:none;overflow:auto;background:rgba(3,4,4,.95);padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
#arch .card,#admin .card{margin:0 auto}
#arch h2,#admin h2{margin:0 0 16px;font-family:var(--f-disp);font-size:26px;font-weight:800;color:#dcdfd2}
.alist{list-style:none;margin:16px 0;padding:0;display:grid;gap:6px}
.abtn{width:100%;text-align:left;font:400 14px var(--f-body);color:var(--fg);background:rgba(207,212,200,.06);border:1px solid rgba(207,212,200,.18);padding:10px 12px;cursor:pointer}
.abtn:disabled{color:var(--dim);cursor:default}
.abtn:not(:disabled):hover,.abtn:focus-visible{border-color:var(--blood);outline:none}
.aid{display:inline-block;min-width:6.2em;font-size:11px;letter-spacing:.1em;color:var(--dim)}
.adetail{min-height:3em;margin:10px 0 18px;font-size:14px;line-height:1.9;color:#c0c6b8}
.adetail p{margin:0 0 8px}
.arow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn.sm{margin-top:0;padding:9px 20px;font-size:13px}
#hide{display:none;background:repeating-linear-gradient(to bottom,#030303 0 11px,transparent 11px 15px)}
#hide::before,#hide::after{content:"";position:absolute;left:0;right:0;background:#030303}
#hide::before{top:0;height:26%}#hide::after{bottom:0;height:26%}
#hud{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));
  display:grid;gap:7px;font-size:12px;letter-spacing:.14em;color:var(--dim);pointer-events:none}
#hud .row{display:flex;align-items:center;gap:10px}
#hud .lab{width:2.8em;text-transform:uppercase}
#hud .bar{width:92px;height:4px;background:rgba(207,212,200,.12);display:block}
#hud .bar i{display:block;height:100%;width:100%;background:var(--sick);transition:width .15s}
#hKeys{display:flex;gap:5px}
#hKeys b{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--dim);display:block}
#hKeys b.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(224,169,63,.7)}
#hObj{margin-top:4px;color:var(--fg);letter-spacing:.06em;font-size:13px;max-width:min(60vw,320px);line-height:1.5}
#sub{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-family:var(--f-disp);font-size:clamp(15px,2.2vw,21px);
  padding:0 max(16px,env(safe-area-inset-left,0px));color:#e6e8de;text-shadow:0 1px 8px #000,0 0 2px #000;opacity:0;transition:opacity .5s;pointer-events:none}
#sub.on{opacity:1}
#prompt{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:14px;letter-spacing:.1em;color:var(--fg);opacity:0;transition:opacity .2s;pointer-events:none;text-shadow:0 0 6px #000}
#prompt.on{opacity:.9}
#cross{position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1px;border-radius:50%;background:rgba(220,225,210,.45);pointer-events:none}
#note{position:absolute;left:50%;top:50%;width:min(86vw,480px);transform:translate(-50%,-50%) rotate(-1.2deg);background:#c9c3a8;color:#1d1a12;
  font-family:var(--f-disp);font-weight:500;font-size:15px;line-height:1.9;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .4s;box-sizing:border-box}
#note.on{opacity:1}
#note small{display:block;margin-top:10px;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;color:#5b5438}
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border:1px solid rgba(207,212,200,.25);border-radius:50%;display:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(207,212,200,.18)}
.tbtn{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(207,212,200,.35);background:rgba(10,12,10,.45);
  color:var(--fg);font:700 13px var(--f-body);letter-spacing:.06em;display:grid;place-items:center;touch-action:none}
#bAct{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px))}
#bFlash{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#bRun{right:max(98px,calc(80px + env(safe-area-inset-right,0px)));bottom:calc(70px + env(safe-area-inset-bottom,0px))}
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(5,6,7,.55),rgba(3,4,4,.94) 75%)}
#screen[hidden]{display:none}
.card{width:100%;max-width:560px;min-width:0;margin:auto 0}
.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--dim);margin:0 0 14px}
h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:clamp(52px,14vw,112px);line-height:1;letter-spacing:.08em;color:#dcdfd2;
  text-shadow:0 0 34px rgba(163,33,26,.5);text-wrap:balance}
h1 span{display:inline-block;animation:flick 6s infinite}
@keyframes flick{0%,86%,100%{opacity:1}87%{opacity:.25}88%{opacity:1}91%{opacity:.4}92%{opacity:1}}
.lead{margin:22px 0 0;font-size:15px;line-height:1.95;color:#aab0a3;text-wrap:pretty}
.ctl{margin:26px 0 0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:13px;color:#a2a89b;align-items:center}
.ctl dt{margin:0;display:flex;gap:4px;flex-wrap:wrap}
.ctl dd{margin:0}
kbd{font:700 11px var(--f-body);letter-spacing:.04em;border:1px solid rgba(207,212,200,.3);padding:2px 7px;color:var(--fg)}
.btn{margin-top:30px;display:inline-block;font:700 15px var(--f-body);letter-spacing:.24em;color:#e9ebe0;background:transparent;border:1px solid var(--blood);
  padding:15px 30px;cursor:pointer;transition:background .2s,box-shadow .2s}
.btn:hover,.btn:focus-visible{background:rgba(163,33,26,.28);box-shadow:0 0 24px rgba(163,33,26,.35);outline:none}
.fine{margin:18px 0 0;font-size:12px;color:var(--dim);line-height:1.8}
.stat{margin:22px 0 0;font-size:14px;color:#aab0a3;line-height:2}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}}
</style>
</head>

const colliders=[];
let exitOpen=false,doorBOpen=false,endOpen=false;
function hitRect(px,pz,r,x0,x1,z0,z1){const cx=clamp(px,x0,x1),cz=clamp(pz,z0,z1);const dx=px-cx,dz=pz-cz;return dx*dx+dz*dz<r*r;}
function solidCell(cx,cy){if(cx<0||cy<0||cx>=W||cy>=H)return true;const c=g[cy][cx];return c==='#'||c==='P'||(c==='E'&&!exitOpen)||(c==='F'&&!doorBOpen)||(c==='X'&&!endOpen);}
function collides(px,pz,r){
  const cx=Math.floor(px/CELL),cy=Math.floor(pz/CELL);
  for(let j=cy-1;j<=cy+1;j++)for(let i=cx-1;i<=cx+1;i++){if(solidCell(i,j)&&hitRect(px,pz,r,i*CELL,(i+1)*CELL,j*CELL,(j+1)*CELL))return true;}
  for(let k=0;k<colliders.length;k++){const b=colliders[k];if(hitRect(px,pz,r,b.x0,b.x1,b.z0,b.z1))return true;}
  return false;
}
function hasLOS(x1,z1,x2,z2){
  const dx=x2-x1,dz=z2-z1,d=Math.hypot(dx,dz),n=Math.max(1,Math.ceil(d/.45));
  for(let i=1;i<n;i++){const t=i/n;if(sightBlocked(Math.floor((x1+dx*t)/CELL),Math.floor((z1+dz*t)/CELL)))return false;}
  return true;
}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const walk=(x,y)=>{
  if(x<0||y<0||x>=W||y>=H||noGo(x,y))return false;
  const c=g[y][x];
  return c==='.'||(c==='E'&&exitOpen)||(c==='F'&&doorBOpen)||(c==='X'&&endOpen);
};
function clearWalkSegment(x1,z1,x2,z2,step=.35){
  const dx=x2-x1,dz=z2-z1,d=Math.hypot(dx,dz),n=Math.max(1,Math.ceil(d/step));
  for(let i=1;i<=n;i++){
    const t=i/n,cx=Math.floor((x1+dx*t)/CELL),cy=Math.floor((z1+dz*t)/CELL);
    if(!walk(cx,cy))return false;
  }
  return true;
}
function sightBlocked(cx,cy){
  if(solidCell(cx,cy))return true;
  const c=g[cy][cx];
  return c==='L'||c==='B'||c==='S';
}
function bfs(sx,sy,tx,ty){
  const idx=(x,y)=>y*W+x,prev=new Int16Array(W*H).fill(-2),q=[idx(sx,sy)];prev[q[0]]=-1;
  const tw=walk(tx,ty),isGoal=(x,y)=>tw?(x===tx&&y===ty):(Math.abs(x-tx)+Math.abs(y-ty)<=1);
  let goal=-1;
  for(let h=0;h<q.length;h++){const cur=q[h],x=cur%W,y=(cur/W)|0;if(isGoal(x,y)){goal=cur;break;}
    for(const d of DIRS){const nx=x+d[0],ny=y+d[1];if(walk(nx,ny)&&prev[idx(nx,ny)]===-2){prev[idx(nx,ny)]=cur;q.push(idx(nx,ny));}}}
  if(goal<0)return null;const path=[];for(let c=goal;c!==-1;c=prev[c])path.push([c%W,(c/W)|0]);return path.reverse();
}

}

function animMonster(dt){

    u.aL.rotation.x=.28+Math.sin(T*6.1)*.18;u.aR.rotation.x=-.28-Math.sin(T*5.6+.8)*.18;
    u.fL.rotation.y=-.35+Math.sin(T*13)*.55;u.fR.rotation.y=-.35+Math.sin(T*11.5+2.1)*.55;
  }else{
    u.aL.rotation.y=.2+Math.sin(T*.8)*.3+Math.sin(w*.5)*.2-tw(.9,0)*.9;u.aR.rotation.y=.2+Math.sin(T*.7+2.3)*.3-Math.sin(w*.5)*.2-tw(.8,3)*.9;

function updatePickups(dt){
  pickups.forEach(p=>{
    if(p.taken)return;
    if(p.type==='key'){const L=p.mesh.children[p.mesh.children.length-1];L.intensity=.9+.35*Math.sin(T*2.2+p.x);}
    if(player.hidden>=0)return;
    if(Math.hypot(p.x-player.x,p.z-player.z)<1.25){
      p.taken=true;p.mesh.visible=false;
      if(p.type==='key'){player.keys++;sfx.chime();sfx.clank();hKeys.children[player.keys-1].classList.add('on');objective();
        if(player.keys>=5){say('扉の鍵が揃った。ダクトが一斉に鳴り、館内の何かが目を覚ました。',5600);ventPts.forEach(v=>setTimeout(()=>sfx.duct(v.x,v.z),rnd(0,1600)));mon.state='chase';mon.seeT=-4;mon.lastKnown={x:player.x,z:player.z};mon.repath=0;mon.graceT=0;sfx.growl();sfx.bang();}
        else{say('鍵の欠片を手に入れた（'+player.keys+'/5）',3000);
          if(Math.hypot(mon.x-player.x,mon.z-player.z)<46&&mon.state!=='chase'&&mon.graceT<=0){mon.lastKnown={x:player.x,z:player.z};mon.state='alert';mon.repath=0;}}}
      else if(p.type==='batt'){player.batt=Math.min(100,player.batt+45);sfx.chime();say('電池を拾った。',2400);}
      else if(p.type==='collect'){collect(p.item);}
      else if(p.type==='c2card'){takeCard();}
      else if(p.type==='c4part'){c4f[p.part]=1;p.taken=true;p.mesh.visible=false;sfx.chime();say(p.label+'を手に入れた。',3400);objective();}else if(p.type==='c3card'){c3f.card=1;sfx.chime();say('管理区域認証カードを手に入れた。',4000);objective();}
      else if(p.type==='c3scard'){c3f.scard=1;sfx.chime();say('保管庫用の認証カードを手に入れた。（任意の区域に使える）',4200);}
      else{notesRead++;sfx.chime();showNote(NOTES[p.idx].t);}
    }
  });
  const near=nearestLocker();
  let txt='';
  if(player.hidden>=0)txt=(coarse?'':'[E] ')+'外に出る';
  else if(near>=0)txt=(coarse?'':'[E] ')+'ロッカーに隠れる';

  else if(c2Near())txt=(coarse?'':'[E] ')+c2Near().label();

  promptEl.textContent=txt;promptEl.classList.toggle('on',!!txt);
}

let lampT=0;
function updateLights(dt){
  lampT-=dt;
  if(lampT<=0){lampT=.4;const arr=liveLamps.map(l=>({l,d:Math.hypot(l.x-camera.position.x,l.z-camera.position.z)})).sort((a,b)=>a.d-b.d);
    for(let i=0;i<3;i++){const t=arr[i];if(t){lampLights[i].position.set(t.l.x,WALLH-.4,t.l.z);lampLights[i].userData.lamp=t.l;}}}
  lampLights.forEach(L=>{const l=L.userData.lamp;if(!l)return;const f=Math.sin(T*(3+l.ph)+l.ph)*Math.sin(T*7.3+l.ph*2);const off=f>.86&&Math.sin(T*.7+l.ph)>0;L.intensity=off?.1:1.1+.25*Math.sin(T*11+l.ph);});
  liveLamps.forEach(l=>{const f=Math.sin(T*(3+l.ph)+l.ph)*Math.sin(T*7.3+l.ph*2);l.mat.emissiveIntensity=(f>.86&&Math.sin(T*.7+l.ph)>0)?.1:1.1;});
  if(lightsOutT>0){lampLights.forEach(L=>{L.intensity=.04;});liveLamps.forEach(l=>{l.mat.emissiveIntensity=.04;});}

}
function updateFX(dt){

const shelfMat=new THREE.MeshStandardMaterial({color:0x3b4540,roughness:.6,metalness:.5}),boxMat=new THREE.MeshStandardMaterial({color:0x6b5a3c,roughness:1});
const SHELF_H=3.0;
function mkShelf(def){
  const g=new THREE.Group();
  [[-1.05,-.22],[1.05,-.22],[-1.05,.22],[1.05,.22]].forEach(([a,b])=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.07,SHELF_H,.07),shelfMat);p.position.set(a,SHELF_H/2,b);g.add(p);});
  for(let i=0;i<4;i++){
    const bd=new THREE.Mesh(new THREE.BoxGeometry(2.2,.05,.52),shelfMat);bd.position.y=.25+i*.85;g.add(bd);
    if(i<3){const bx=new THREE.Mesh(new THREE.BoxGeometry(rnd(.4,.9),rnd(.3,.55),.38),boxMat);bx.position.set(rnd(-.7,.7),.25+i*.85+.28,0);g.add(bx);}
  }
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  g.position.set(def.x,0,def.z0);scene.add(g);return g;
}
const shelves=[{x:172,z0:30,dir:1},{x:181,z0:33,dir:-1},{x:190,z0:27.6,dir:1},{x:190,z0:35.4,dir:-1},{x:197,z0:31,dir:1}].map(d=>({...d,g:mkShelf(d),state:'idle',t:0,ang:0,vel:0,col:{x0:d.x-1.15,x1:d.x+1.15,z0:d.z0-.3,z1:d.z0+.3}}));
shelves.forEach(sh=>colliders.push(sh.col));
function resetShelves(){shelves.forEach(sh=>{sh.state='idle';sh.t=0;sh.ang=0;sh.vel=0;sh.g.rotation.x=0;sh.col.x0=sh.x-1.15;sh.col.x1=sh.x+1.15;sh.col.z0=sh.z0-.3;sh.col.z1=sh.z0+.3;});}
function landShelf(sh){
  sfx.bang();shake=Math.max(shake,.7);
  const zl=Math.min(sh.z0,sh.z0+sh.dir*SHELF_H),zh=Math.max(sh.z0,sh.z0+sh.dir*SHELF_H);
  sh.col.x0=sh.x-1.2;sh.col.x1=sh.x+1.2;sh.col.z0=zl;sh.col.z1=zh;
  if(player.hidden<0&&Math.abs(player.x-sh.x)<1.5&&player.z>zl-.3&&player.z<zh+.3){
    player.stun=1.5;mon.slowT=2.2;player.z=sh.dir>0?zh+.6:zl-.6;flash(.35);say('棚の下敷きになった。',2000);
  }
}
function updateShelves(dt){
  shelves.forEach(sh=>{
    if(sh.state==='idle'){
      if(phase==='chase'&&player.x>sh.x-6.5&&player.x<sh.x+4){sh.state='warn';sh.t=0;sfx.creak();}
    }else if(sh.state==='warn'){
      sh.t+=dt;sh.ang=sh.dir*(.05+.04*Math.sin(sh.t*28));
      if(sh.t>.8){sh.state='fall';sh.vel=0;sh.ang=.1;}
    }else if(sh.state==='fall'){
      sh.vel+=16*dt;sh.ang+=sh.vel*dt;
      if(sh.ang>=Math.PI/2){sh.ang=Math.PI/2;sh.state='down';landShelf(sh);}
    }
    sh.g.rotation.x=(sh.state==='fall'||sh.state==='down')?sh.dir*sh.ang:sh.ang;
  });
}

  };
  person(96,215,170,'#3b3226',false);person(224,215,160,'#5a3f36',true);person(160,215,100,'#6b5c44',false);

  const vg=x.createRadialGradient(160,120,60,160,120,200);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(30,18,6,.55)');x.fillStyle=vg;x.fillRect(0,0,320,240);

}

  photo.mesh.position.set(photo.x+Math.sin(photo.t*3.1)*.5*(1-k),Math.max(.03,3.1*(1-k*k)),photo.z+Math.cos(photo.t*2.3)*.3*(1-k));

const SEVWP=[[30,30],[36,36],[26,27],[32,33],[24,36],[16,31],[16,39],[50,32],[46,36],[55,27],[48,27],[62,30],[62,40],[48,49],[52,52],[44,48],[62,22],[40,19]];
function sevSpawn(x,z,state){mon.x=x;mon.z=z;mon.state=state||'patrol';mon.path=null;mon.pose=null;mon.py=0;monMesh.rotation.set(0,0,0);monMesh.scale.set(1,1,1);sv.active=true;sv.script=null;sv.headUp=false;sv.idle=0;sv.rep=0;sv.rolled=false;sv.lockerT=0;sv.grace=0;monMesh.visible=true;setSevLook(true);}
function sevSpawnPatrol(){
  const pc=pCell();let best=null,bd=-1;
  curWP().forEach(w=>{const d=Math.hypot(cc(w[0])-player.x,cc(w[1])-player.z);if(d>bd&&d>22&&bfs(w[0],w[1],pc[0],pc[1])){bd=d;best=w;}});
  const w=best||[30,30];sevSpawn(cc(w[0]),cc(w[1]),'patrol');sv.grace=8;
}
function sevHear(x,z,R){if(!sv.active||sv.script||mon.state==='chase')return;if(Math.hypot(x-mon.x,z-mon.z)<R){sv.lk={x,z};mon.state='investigate';sv.rep=0;sv.idle=0;mon.path=null;}}
function sevPick(){
  const c=monCell();let cand=curWP().filter(w=>!(w[0]===c[0]&&w[1]===c[1])).sort(()=>Math.random()-.5);
  if(Math.random()<.4)cand.sort((a,b)=>Math.hypot(cc(a[0])-player.x,cc(a[1])-player.z)-Math.hypot(cc(b[0])-player.x,cc(b[1])-player.z));
  for(const w of cand.slice(0,7)){if(noGo(w[0],w[1]))continue;const p=bfs(c[0],c[1],w[0],w[1]);if(p&&p.length>2){mon.path=p;sv.wp=w;return;}}
  sv.idle=2;
}
function updateSev(dt){
  if(!sv.active){monMesh.visible=false;mon.dist=99;if(sv.react>0){sv.react-=dt;if(sv.react<=0&&c2f.SEV_SEEN&&!c2f.FINAL&&!c2f.CAM)sevSpawnPatrol();}return;}
  monMesh.visible=true;
  const px=player.x,pz=player.z,d=Math.hypot(px-mon.x,pz-mon.z);mon.dist=d;
  if(admin.freeze||sv.script)return;
  const safe=inSafeP(),hid=player.hidden>=0;
  sv.grace-=dt;sv.rep-=dt;mon.growlT-=dt;
  let sees=false;
  if(sv.grace<=0&&!hid&&!safe){const range=player.light?14:6.5;if(d<range&&hasLOS(mon.x,mon.z,px,pz))sees=true;}
  if(sv.grace<=0&&!hid&&!safe&&mon.state!=='chase'){const nr=player.running?11:((inMetal()&&player.moving)?8:0);if(nr&&d<nr)sevHear(px,pz,nr);}
  if(sees){sv.lk={x:px,z:pz};sv.seeT=0;if(mon.state!=='chase'){mon.state='chase';sv.rep=0;sfx.shriek();flash(.12);mon.path=null;}}
  else if(mon.state==='chase'){sv.seeT+=dt;if(sv.seeT>(hid?.01:4.5)){mon.state='search';sv.searchT=7;sv.rep=0;mon.path=null;}}
  if(!hid){sv.lockerT=0;sv.rolled=false;}
  if(c2f.FINAL&&!c2f.CAM&&!hid&&!safe&&mon.state==='chase'){sv.lk={x:px,z:pz};sv.seeT=0;}
  let speed=1.9,moving=true;
  if(mon.state==='chase'){
    speed=sv.spd;
    if(sees&&d<CELL*1.3&&hasLOS(mon.x,mon.z,px,pz))stepAlong(dt,speed,px,pz);
    else{if(sv.rep<=0){sv.rep=.3;setTarget(sv.lk.x,sv.lk.z);}if(!stepAlong(dt,speed)){mon.state='search';sv.searchT=5;mon.path=null;}}
    if(d<1.1&&!safe&&!hid&&hasLOS(mon.x,mon.z,px,pz)){die(false);return;}
  }else if(mon.state==='investigate'){
    speed=2.9;const lk=sv.lk;if(sv.rep<=0){sv.rep=.5;setTarget(lk.x,lk.z);}
    const ok=stepAlong(dt,speed);if(!ok||Math.hypot(lk.x-mon.x,lk.z-mon.z)<1.6){mon.state='search';sv.searchT=6;mon.path=null;}
  }else if(mon.state==='search'){
    speed=1.7;sv.searchT-=dt;
    if(hid){
      const L=lockerObjs[player.hidden],dl=Math.hypot(mon.x-L.cx,mon.z-L.cz);
      if(dl>2.4){if(sv.rep<=0){sv.rep=.5;setTarget(sv.lk.x,sv.lk.z);}stepAlong(dt,speed);}
      else{sv.lockerT+=dt;mon.yaw+=dt*.6;moving=false;lockerCue(L,sv.lockerT);
        if(sv.lockerT>3.4&&!sv.rolled){sv.rolled=true;lockerCue(L,0);if(player.light){die(true);return;}say('……足音が遠ざかっていく。',3200);mon.state='patrol';mon.path=null;}}
    }else{
      if(!mon.path||mon.path.length<2){const cand=curWP().filter(w=>Math.hypot(cc(w[0])-sv.lk.x,cc(w[1])-sv.lk.z)<34&&!noGo(w[0],w[1]));
        if(cand.length){const w=cand[(Math.random()*cand.length)|0],c=monCell();mon.path=bfs(c[0],c[1],w[0],w[1]);}}
      if(!stepAlong(dt,speed))moving=false;
      if(sv.searchT<=0){mon.state='patrol';mon.path=null;}
    }
  }else{
    mon.state='patrol';
    if(sv.idle>0){sv.idle-=dt;moving=false;}
    else if(!mon.path||mon.path.length<2){if(mon.path){sv.idle=rnd(1.5,3.5);mon.path=null;}else sevPick();moving=false;}
    else stepAlong(dt,speed);
  }
  if(moving)mon.walkT+=dt*(speed*1.8);
  mon.stepT-=dt;if(mon.stepT<=0&&moving){mon.stepT=mon.state==='chase'?.36:.64;if(d<24)sfx.mstep(mon.state==='chase');}
  if(mon.growlT<=0&&d<12&&mon.state!=='chase'){mon.growlT=rnd(8,16);sfx.growl();}
}

function updateC3(dt){
  c3.t+=dt;updateC2Doors(dt);refreshCams();
  if(lightsOutT>0)lightsOutT-=dt;
  const pc=pCell();
  /* 回復・CP */
  if(inCells(pc,30,40,61,67)){player.batt=Math.min(100,player.batt+7*dt);player.stam=Math.min(100,player.stam+30*dt);setCP3(1);}
  if(inCells(pc,68,73,71,76)){player.batt=Math.min(100,player.batt+7*dt);player.stam=Math.min(100,player.stam+30*dt);if(c3f.lever7)setCP3(2);}
  /* E01 カメラの視線 */
  if(!c3f.CAMERA_EVENT){
    if(c3.t>1&&!c3.e1a){c3.e1a=1;sfx.clank();sfx.creak();say('監視前室。……天井のカメラが、再びこちらを向いた。ランプが赤く点く。',4800);}
    if(c3.t>4&&!c3.e1b){c3.e1b=1;flash(.25);sfx.radio();say('古いモニターに映像が一瞬映り、ノイズに消えた。',3600);}
    if(c3.t>7){c3f.CAMERA_EVENT=1;objective();}
    const dx=player.x-cctv.position.x,dz=player.z-cctv.position.z;cctv.rotation.y=Math.atan2(dx,dz);
  }
  /* カメラの追従（ONLINEのみ） */
  cams.forEach(c=>{if(!c.mesh||c.id==='CAM_001'&&!c3f.CAMERA_EVENT)return;if(camState(c)==='ONLINE'&&c.view&&inCells(pc,c.view[0],c.view[1],c.view[2],c.view[3])){const ty=Math.atan2(player.x-c.cx,player.z-c.cz);let da=ty-c.mesh.rotation.y;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;c.mesh.rotation.y+=da*Math.min(1,dt*2);}});
  /* 情報伝達（撮影→中継→確認→送信→受信） */
  const seen=camSeen();c3.eyeCam=seen||c3.eyeCam;
  if(c3.stage===0){if(seen){c3.pv+=dt;if(c3.pv>2){c3.stage=1;c3.st=0;c3.lost=0;c3.need=(c3d.R1.target&&c3d.R2.target&&false)?7:3.8;}}else{c3.pv=Math.max(0,c3.pv-dt);if(c3.pv===0)c3.eyeCam=null;}}
  else if(c3.stage===1){c3.st+=dt;if(!seen){c3.lost+=dt;if(c3.lost>3){c3.stage=0;c3.pv=0;c3.eyeCam=null;}}else c3.lost=0;
    if(c3.st>c3.need){c3.stage=2;c3.st=0;if(c3f.CONTROL_ACCESSED&&Math.random()<.6){lightsOutT=5;say('照明が落ちた。……ミラーが、こちらを見ている。',3600);sfx.clank();}}}
  else if(c3.stage===2){if(c3f.comm){c3.st+=dt;if(c3.st>4){c3.stage=3;c3.cd=8;c3f.sent++;sfx.radio();say('……映像が、どこかへ送られた。',3200);}}}
  else if(c3.stage===3){c3.cd-=dt;if(c3.cd<=0){c3.stage=0;c3.pv=0;c3.eyeCam=null;}}
  pipelineHud();
  /* M06 到達・E04 ミラー初目撃 */
  if(inCells(pc,54,66,60,68)){
    if(!c3f.CONTROL_ACCESSED)c3f.CONTROL_ACCESSED=1;
    if(!c3f.MIRROR_SEEN&&c3f.RELAY){c3f.MIRROR_SEEN=1;c3.mirFx=2.8;sfx.radio();flash(.2);say('複数の画面に、自分が映っている。その一つに、背の高い影……こちらを見ている。',5400);}
  }
  if(c3.mirFx>0){c3.mirFx-=dt;}
  c3.monT-=dt;if(c3.monT<=0&&(inCells(pc,54,66,60,68)||state==='archive')){c3.monT=.25;drawMon();}
  if(inCells(pc,54,66,70,76)&&!c3f.SERVER_ACCESSED)c3f.SERVER_ACCESSED=1;
  /* E05 遠隔妨害 */
  if(c3.ctrlT>0){c3.ctrlT-=dt;if(c3.ctrlT<=0){const d=c3.ctrlDoor==='r1'?c3d.R1:c3d.R2;if(tryClose(d)){c3f[c3.ctrlDoor]=0;c3.mirFx=2.2;say('扉が、独りでに閉まった。……ミラーが閉鎖した。別の経路を選べ。',4600);sfx.bang();flash(.15);}else c3.ctrlT=.5;}}
  /* E07/E08 無監視通路 */
  if(c3f.POWER&&inCells(pc,70,70,78,85)){
    if(!c3f.UNREG){c3f.UNREG=1;c3.mirT=9;say('このあたりには、カメラが一台もない。故障ではない。……最初から、監視網の外だ。',5600);}
  }
  if(c3.mirT>0){c3.mirT-=dt;if(c3.mirT<=0&&!sv.active){c3.mirT=-1;mirSpawn();}}
  if(sv.active&&c3f.POWER&&!c3f.TERM_LOG){updateSev(dt);}else if(sv.active){updateSev(dt);}else{monMesh.visible=false;mon.dist=99;}
  /* E10 章末 */
  if(c3f.TERM_LOG&&!c3f.EXIT_EVENT&&inCells(pc,38,46,85,85)){c3f.EXIT_EVENT=1;say('古い配管の匂い。……案内図にない通路が、闇の奥へ続いている。',5200);}
  if(c3f.EXIT_EVENT&&!c3f.CLEARED&&pc[0]<=40){c3f.CLEARED=1;sevOff();monMesh.visible=false;saveGame();setTimeout(()=>{if(chapter===3&&c3f.CLEARED)winC3();},800);}
}

  else{c.strokeStyle='rgba(30,22,18,.9)';c.lineWidth=5;for(let g=0;g<3;g++)for(let i=0;i<4;i++){c.beginPath();c.moveTo(40+g*70+i*12,40+g*62);c.lineTo(40+g*70+i*12,92+g*62);c.stroke();}for(let g=0;g<3;g++){c.beginPath();c.moveTo(34+g*70,86+g*62);c.lineTo(92+g*70,46+g*62);c.stroke();}}});}

function ambient4(dt,tense){

  else if(k===2){sfx.whisper();say('……誰かが、囁いたような気がした。',3200);}

  else if(k===4){let b=null,bd=15;for(const id in NPCS){const n=NPCS[id];if(!n.vis)continue;const d=Math.hypot(n.x-player.x,n.z-player.z);if(d<bd){bd=d;b=n;}}
    if(b)say(b.name+'が、足を止めて、じっとこちらを見ている。',3400);else{sfx.whisper();say('背中に、視線を感じる。',3000);}}
  else if(k===5){sfx.clank();say('金属を引きずる音。……すぐに止んだ。',3200);}
  else{sfx.breath();say('すぐ近くで、息づかいが聞こえた。……気のせいだ。',3200);}
}
function lockerCue(L,t){
  if(t<=0){L.k1=L.k2=0;return;}
  if(t<.3){L.k1=L.k2=0;}
  if(t>1.1&&!L.k1){L.k1=1;sfx.locker();sfx.creak();shake=Math.max(shake,.25);say(player.light?'扉の外で、足音が止まった。……隙間から、灯りが漏れている。':'扉の外で、足音が止まった。……息を殺せ。',2800);}
  if(t>2.3&&!L.k2){L.k2=1;sfx.bang();shake=Math.max(shake,.5);say(player.light?'扉を叩く音。……灯りを消せ！':'扉が、ゆっくりと叩かれた。……動くな。',2200);}
}


/* ---- アイデント個体（ネラ／ガルド）：量産型より大きく、いかつい怪物の姿 ---- */
function mkBeast(id){
  const G=id==='gardo',gr=new THREE.Group(),body=new THREE.Group();
  const skin=new THREE.MeshStandardMaterial({color:G?0x4a2f2a:0x35575c,roughness:.8}),
        arm=new THREE.MeshStandardMaterial({color:G?0x26262b:0xcfc8b6,roughness:.45,metalness:G?.7:.2}),
        dark=new THREE.MeshStandardMaterial({color:0x151515,roughness:.7}),
        glow=new THREE.MeshBasicMaterial({color:G?0xff5a1a:0x7fffe0,fog:false}),
        tooth=new THREE.MeshStandardMaterial({color:0xe8e0d0,roughness:.4});
  const S=G?1.28:1.05;
  const add=(m,p,par)=>{(par||body).add(m);return m;};
  const box=(w,h,d,mat,x,y,z,par)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;return add(m,null,par);};
  const cyl=(rt,rb,h,mat,x,y,z,par)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,9),mat);m.position.set(x,y,z);m.castShadow=true;return add(m,null,par);};
  const cone=(r,h,mat,x,y,z,rx,rz,par)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),mat);m.position.set(x,y,z);m.rotation.set(rx||0,0,rz||0);return add(m,null,par);};
  /* 脚（太く、膝に棘） */
  [-1,1].forEach(s=>{cyl(.2*S,.24*S,1.0*S,skin,s*.3*S,.55*S,0,gr);cone(.07*S,.3*S,arm,s*.3*S,.62*S,.2*S,Math.PI/2,0,gr);box(.38*S,.14*S,.55*S,dark,s*.3*S,.07*S,.08*S,gr);});
  /* 胴：広い肩と厚い胸 */
  const tz=new THREE.Group();tz.position.y=1.5*S;body.add(tz);
  box(1.2*S,.9*S,.7*S,skin,0,0,0,tz);box(.9*S,.5*S,.62*S,skin,0,-.65*S,0,tz);
  box(1.0*S,.6*S,.18*S,arm,0,.08*S,.34*S,tz);box(.9*S,.14*S,.2*S,arm,0,-.28*S,.34*S,tz);       /* 胸甲 */
  [-1,1].forEach(s=>{box(.5*S,.28*S,.62*S,arm,s*.7*S,.52*S,0,tz);cone(.09*S,.36*S,arm,s*.82*S,.8*S,0,0,s*-.35,tz);});    /* 肩当てと棘 */
  for(let i=0;i<5;i++)cone(.06*S,.34*S,arm,0,(.42-i*.2)*S,-.42*S,-Math.PI/2.4,0,tz);              /* 背の棘 */
  /* 腕：長く太く、爪 */
  const arms=[[-1,1],[1,1]];if(!G){arms.push([-1,.55],[1,.55]);}
  arms.forEach(([s,k],ai)=>{const ag=new THREE.Group();ag.position.set(s*.78*S*(ai>1?.8:1),(ai>1?.05:.45)*S,0.05);tz.add(ag);
    const L=(G?1.15:1.0)*k;cyl(.17*S*k,.14*S*k,L*S,skin,0,-.5*L*S,0,ag);cyl(.15*S*k,.2*S*k,.3*S,arm,0,-.15*S,0,ag);
    const fg=new THREE.Group();fg.position.y=-L*S;ag.add(fg);cyl(.13*S*k,.1*S*k,.8*S*k,skin,0,-.35*S*k,0,fg);
    box(.22*S*k,.24*S*k,.22*S*k,arm,0,-.8*S*k,0,fg);
    for(let c=-1;c<=1;c++)cone(.035*S*k,.38*S*k,tooth,c*.07*S*k,-1.05*S*k,.03*S,Math.PI,0,fg);
    ag.rotation.z=s*(.12+(ai>1?.25:0));ag.rotation.x=ai>1?.1:0;});
  /* 頭：顎・歯・角・光る目 */
  const hd=new THREE.Group();hd.position.set(0,1.05*S,.1*S);tz.add(hd);
  const sk=new THREE.Mesh(new THREE.SphereGeometry(.34*S,14,12),skin);sk.scale.set(1,.95,1.05);hd.add(sk);
  box(.5*S,.22*S,.4*S,skin,0,-.3*S,.14*S,hd);
  for(let i=-2;i<=2;i++)cone(.025*S,.12*S,tooth,i*.085*S,-.4*S,.3*S,Math.PI,0,hd);
  for(let i=-2;i<=2;i++)cone(.022*S,.1*S,tooth,i*.085*S,-.22*S,.32*S,0,0,hd);
  [-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.06*S,8,8),glow);e.position.set(s*.13*S,.04*S,.3*S);hd.add(e);
    cone(.09*S,(G?.62:.46)*S,arm,s*.24*S,.36*S,-.02*S,0,s*-.5,hd);if(G)cone(.06*S,.4*S,arm,s*.3*S,.18*S,-.1*S,.3,s*-1.1,hd);});
  body.userData={};gr.add(body);
  gr.userData={body:tz,head:hd,beast:true};scene.add(gr);return gr;
}

function openTalk(node){
  if(state!=='play')return;clearInput();state='archive';try{document.exitPointerLock();}catch(e){}promptEl.classList.remove('on');
  gotoNode(node);archEl.style.display='block';sfx.click();
}
function gotoNode(nx){
  const node=typeof nx==='function'?nx():nx;if(!node){closeArchive();return;}
  c4.node=node;if(node.show)node.show();
  const n=node;let h='<div class="card"><p class="eyebrow">'+n.who+'</p>';
  n.lines.forEach(l=>{h+='<p style="font-size:17px;line-height:1.9;margin:0 0 10px">'+l+'</p>';});
  if(n.choices)n.choices.forEach((c,i)=>{h+='<button class="btn sm" type="button" data-act="c4pick" data-i="'+i+'" style="display:block;margin:6px 0;text-align:left">'+c.t+'</button>';});
  else h+='<button class="btn sm" type="button" data-act="c4next" style="margin-top:8px">'+(n.next?'次へ':'閉じる')+'</button>';
  archEl.innerHTML=h+'</div>';
}
function c4Act(b){
  const a=b.dataset.act;
  if(a==='c4pick'){const c=c4.node.choices[+b.dataset.i];if(c.fn)c.fn();gotoNode(c.go);}
  else if(a==='c4next'){const n=c4.node;if(n.fn)n.fn();gotoNode(n.next);}
}

function talkGuard(){
  if(c4f.HAVEN_ENTRY)return N('見張り',['……通れ。妙な真似はするな。','ネラが、居住区の入口で待っている。']);
  const end=(t,g)=>N('見張り',[t],{show:()=>{setF('HAVEN_ENTRY');c4f.t.guard=g;sfx.clank();c4Gate();say('内門が開いた。',2600);}});
  return N('見張り',['止まれ。','武器や持ち物は見ない。ここで聞くのは、お前が何者で、何のために来たか──それだけだ。'],{choices:[
    {t:'「病院から逃げてきた。」',go:end('病院から、か。……あそこの目は、ここまで届かない。それは知っているな。通れ。ネラが見ている。',1)},
    {t:'「ここを探していた。」',go:end('探していた？　誰に聞いた。……まあいい。通れ。ただし、目は離さない。',0)},
    {t:'「……分からない。」',go:end('分からない、か。正直だな。通れ。それ以上は、ネラに話せ。',1)}]});
}

function c4Objective(){
  if(c4f.CH4_CLEARED)return '';
  if(!c4f.hatch1&&!c4f.HAVEN_ENTRY)return '旧保守通路の閉鎖扉を開け、検問所へ';
  if(!c4f.HAVEN_ENTRY)return '検問所で見張りの問いに答える';
  if(!c4f.NERA_CONTACT)return '居住区入口でネラと話す';
  if(!c4f.LIFE_SUPPORT_REPAIRED)return '部品（ソケット／ベルト）を探し、工房の作業台で修理する'+(c4f.partA?'　ソケット済':'')+(c4f.partB?'　ベルト済':'');
  if(!c4f.FOOD_SYSTEM_SEEN)return '食料保管庫で配給表を調べる';
  if(c4f.t.nera<2)return 'ネラに、病院の情報を共有するか話す';
  if(!c4f.HAVEN_RECORDS_FOUND)return '記録・診療室で名簿と記録を調べる';
  if(!c4f.h9)return '防衛詰所でガルドに会う';
  return '中央集会室へ';
}

    {t:'「迷惑はかけない。働く。」',go:s6,fn:reply('duty')},{t:'「知っていることは、すべて話す。」',go:s6,fn:reply('info')},{t:'「あなたたちの判断に従う。」',go:s6,fn:reply('obey')}]});

  const s2=N(GARDO,['改めて言う。私は、お前を無条件には受け入れられない。','身元を示す記録が、ここには何もない。それだけで、十分に危険だ。'],{show:()=>{setF('GARDO_INTRO');if(c4f.t.gardo<1)c4f.t.gardo=0;},next:s3});

/* --- 進行 --- */
function setCP4(n){if(c4f.cp>=n)return;c4f.cp=n;saveGame();say('チェックポイント。（オートセーブ）',3400);}
function updateC4(dt){
  c4.t+=dt;updateC2Doors(dt);ambient4(dt,false);
  const pc=pCell();
  /* 住民は近づくとこちらを向く */
  for(const id in NPCS){const n=NPCS[id];if(!n.vis)continue;const dx=player.x-n.x,dz=player.z-n.z,d=Math.hypot(dx,dz);
    if(d<8){let a=Math.atan2(dx,dz)-n.mesh.rotation.y;while(a>Math.PI)a-=6.283;while(a<-Math.PI)a+=6.283;n.mesh.rotation.y+=a*Math.min(1,dt*2.5);}
    n.mesh.userData.body.rotation.z=Math.sin(c4.t*.8+n.x)*.02;}
  if(inCells(pc,10,52,114,124))setCP4(1);
  if(inCells(pc,42,50,126,131)){setCP4(2);}
  /* 回復 */
  if(inCells(pc,10,52,114,124)||inCells(pc,28,40,109,112)){player.batt=Math.min(100,player.batt+6*dt);player.stam=Math.min(100,player.stam+30*dt);}
  /* E01：検問所に入ったら */
  if(!c4f.HAVEN_ENTRY&&!c4.e1&&inCells(pc,31,37,103,107)&&pc[1]<=106){c4.e1=1;openTalk(talkGuard());}
  /* E02：居住区入口でネラ */
  if(c4f.HAVEN_ENTRY&&!c4f.NERA_CONTACT&&!c4.e2&&inCells(pc,28,40,109,112)){c4.e2=1;openTalk(talkNera());}
  /* E05：記録・診療室 */
  if(inCells(pc,67,72,115,119)&&!c4f.HAVEN_RECORDS_FOUND){setF('HAVEN_RECORDS_FOUND');collect(COLLECT.find(i=>i.id==='CH4_RPT_001'),true);say('住民名簿と、襲撃後の記録が残されている。',4200);}
  if(inCells(pc,42,50,126,131)&&!c4f.h9&&!c4.e5){c4.e5=1;say('巨躯の個体が、こちらを見ている。……ガルド。',3600);}
  /* E06/E07：中央集会室 */
  if(c4f.h9&&!c4f.GARDO_INTRO&&!c4.e6&&inCells(pc,2,8,116,122)){c4.e6=1;openTalk(c4Scene());}
  if(c4f.CH4_CLEARED&&!c4.sceneDone){c4.sceneDone=1;saveGame();setTimeout(()=>{if(chapter===4&&c4f.CH4_CLEARED)winC4();},300);}

function eStep(e,dt,sp){
  if(e.path){while(e.path.length>1&&Math.hypot(cc(e.path[1][0])-e.x,cc(e.path[1][1])-e.z)<.3)e.path.shift();}

  e.x=nx;e.z=nz;let da=Math.atan2(dx,dz)-e.yaw;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;e.yaw+=da*Math.min(1,dt*8);return true;}

function updGuard(r,dt){
  if(!r.on){r.mesh.visible=false;return;}r.mesh.visible=true;if(r.grace>0)r.grace-=dt;
  const dx=player.x-r.x,dz=player.z-r.z,d=Math.hypot(dx,dz)||1,hid=player.hidden>=0,dot=(dx*Math.sin(r.yaw)+dz*Math.cos(r.yaw))/d,rng=(player.light?15:9)+(r.role==='watch'?4:0);
  const sees=!hid&&state==='play'&&r.grace<=0&&hasLOS(r.x,r.z,player.x,player.z)&&((d<rng&&dot>.5)||d<2.2);
  if(r.state==='patrol'){
    if(r.role==='patrol'){const w=r.wps[r.wi%r.wps.length];r.rep-=dt;if(!r.path||r.rep<=0){r.rep=1;ePath(r,cc(w[0]),cc(w[1]));}
      if(!eStep(r,dt,1.9)||Math.hypot(cc(w[0])-r.x,cc(w[1])-r.z)<2.2)r.wi++;}
    else{const p=r.post||(r.post=[r.x,r.z,r.yaw]);r.rep-=dt;
      if(Math.hypot(p[0]-r.x,p[1]-r.z)>1.5){if(!r.path||r.rep<=0){r.rep=1;ePath(r,p[0],p[1]);}eStep(r,dt,1.9);}
      else{r.path=null;r.hold=(r.hold||0)+dt;r.yaw=p[2]+Math.sin(r.hold*(r.role==='watch'?.5:.25))*(r.role==='watch'?1.2:.6);}}
    if(sees)c7Chase(r);else if(!hid&&r.grace<=0&&player.running&&player.moving&&d<8){r.state='alert';r.tx=player.x;r.tz=player.z;r.sT=0;r.path=null;sfx.growl&&sfx.growl();}
  }else if(r.state==='alert'){
    r.rep-=dt;if(!r.path||r.rep<=0){r.rep=.8;ePath(r,r.tx,r.tz);}
    const mv=eMove(r,dt,2.6,r.tx,r.tz);if(sees){c7Chase(r);}else if(!mv||Math.hypot(r.tx-r.x,r.tz-r.z)<2){r.sT+=dt;r.yaw+=dt*1.6;if(r.sT>2.6){r.state='patrol';r.path=null;}}
  }else if(r.state==='chase'){
    if(sees){r.lostT=0;r.lx=player.x;r.lz=player.z;}else r.lostT+=dt;
    r.rep-=dt;if(r.rep<=0){r.rep=.4;ePath(r,sees?player.x:r.lx,sees?player.z:r.lz);}
    eMove(r,dt,3.3,sees?player.x:r.lx,sees?player.z:r.lz);
    if(d<1.15&&state==='play'&&!hid){mon.x=r.x;mon.z=r.z;die(false);}
    else if(hid&&d<5&&r.lostT>.6){r.state='search';r.sT=0;}
    else if(r.lostT>6){r.state='patrol';r.path=null;}
  }else if(r.state==='search'){
    if(player.hidden<0){r.state=sees?'chase':'patrol';r.lostT=0;}
    else{const L=lockerObjs[player.hidden];r.sT+=dt;r.yaw=Math.atan2(L.cx-r.x,L.cz-r.z);lockerCue(L,r.sT);
      if(r.sT>3.8){if(player.light){mon.x=r.x;mon.z=r.z;die(true);r.sT=0;}else{lockerCue(L,0);r.state='patrol';r.path=null;r.wi++;say('足音が、遠ざかっていく。',2600);}}}
  }
  eSync(r);
}

  const hd=new THREE.Group();hd.position.set(0,1.92,.04);hp.add(hd);
  const sk=new THREE.Mesh(new THREE.SphereGeometry(.2,14,12),wht);sk.scale.set(.85,1.5,.95);hd.add(sk);
  [-1,1].forEach(s=>{const e=bx(.05,.2,.02,eye,s*.075,.04,.19,hd);e.rotation.z=s*-.12;});
  const arm=(s)=>{const ag=new THREE.Group();ag.position.set(s*.38,1.15,0);hp.add(ag);cy(.06,.05,1.3,blk,0,-.65,0,ag);
    const fg=new THREE.Group();fg.position.y=-1.3;ag.add(fg);cy(.05,.04,1.3,blk,0,-.65,0,fg);

const SHOW_AGE_RATING=false; /* 対象年齢表示を出すか。実際に取得した区分でない場合は false にすること */
function playOpeningSequence(){
  const sequence=[
    {src:CREATOR_LOGO_SRC,alt:'Accessible Horror Entertainment 製作者ロゴ',className:'opening-creator'},
    {src:AGE_RATING_SRC,alt:'CERO A 全年齢対象',className:'opening-rating',off:!SHOW_AGE_RATING},
    {src:TITLE_LOGO_SRC,alt:'闇の病棟 タイトルロゴ',className:'opening-title'}
  ].filter(x=>!x.off);
  const overlay=document.createElement('div');
  overlay.id='openingSequence';overlay.setAttribute('role','presentation');
  const img=document.createElement('img');img.alt='';overlay.appendChild(img);
  const hint=document.createElement('div');hint.className='skip-hint';hint.textContent='クリック / キーでスキップ';overlay.appendChild(hint);
  stage.appendChild(overlay);
  let index=0,done=false;const tids=[];
  const later=(fn,ms)=>{const id=window.setTimeout(fn,ms);tids.push(id);};
  function finish(){
    if(done)return;done=true;tids.forEach(clearTimeout);tids.length=0;
    document.removeEventListener('keydown',onKey,true);
    overlay.classList.remove('visible');overlay.classList.add('fade-out');
    window.setTimeout(()=>{if(overlay.parentNode)overlay.remove();},520);
  }
  /* ロゴ表示中の入力はタイトル画面・ゲームへ渡さない（クリック／タップ／キーでスキップ） */
  function eat(e){e.stopPropagation();}
  ['pointerdown','mousedown','touchstart','touchend','mouseup','contextmenu'].forEach(t=>overlay.addEventListener(t,e=>{e.stopPropagation();if(t==='contextmenu')e.preventDefault();}));
  overlay.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();finish();});
  function onKey(e){if(done)return;e.stopPropagation();e.preventDefault();if(!e.repeat)finish();}
  document.addEventListener('keydown',onKey,true);
  function showNext(){
    if(done)return;
    overlay.classList.remove('visible');
    later(()=>{
      if(done)return;
      if(index>=sequence.length){finish();return;}
      const item=sequence[index++];
      img.src=item.src;img.alt=item.alt;img.className=item.className;
      overlay.classList.add('visible');
      later(showNext,2200);
    },420);
  }
  showNext();
}

objective();showScreen('title');playOpeningSequence();requestAnimationFrame(frame);
